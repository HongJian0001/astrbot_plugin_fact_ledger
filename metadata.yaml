name: astrbot_plugin_fact_ledger
display_name: 成长台账
short_desc: 体重、攒钱、打卡等数值的状态机，带证据链，回答不瞎编
desc: |
  把会变的数值（体重、攒钱、连续打卡、学习进度、关系阶段）做成带原因和证据的状态机。

  - 七种规则：递减到目标 / 递增到目标 / 连续打卡 / 阶段只进不退 / 累计计数 / 手动设值 / 固定属性
  - 随机浮动：可配置平台期与小幅回升，不是每天必掉
  - 确认后执行：到点只提示待确认，模型确认后才真正改数值
  - 目标 + 截止日期 + 上下限 + 一致性校验
  - 每次变化都有时间、原因、来源，能回答「为什么是这个数」
  - 身份卡（肤色/发型/瞳色/五官）以人设为准；三围等私密项仅主人私聊可查
  - 配置页双向同步，21 个字段可直接查看和修改
  - 可选回写记忆插件，把最新值覆盖成唯一一条核心事实
help: 发送 /台账 查看；/台账 加 ... 新增指标；/台账 详情 <key> 看变化与证据
version: 0.1.1
author: 君莫笑
